name: assignment

# 課題 Issue が作成されたら、章ラベルに対応する正答で自動採点する。
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  grade:
    if: contains(github.event.issue.labels.*.name, 'assignment') || startsWith(github.event.issue.title, '[課題')
    runs-on: ubuntu-latest
    steps:
      - name: Grade assignment answers
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');

            // 正解は平文ではなく、正規化後の SHA-256 だけを保持する。
            const answerHashes = {
              ch01: [
                '4ec9599fc203d176a301536c2e091a19bc852759b255bd6818810a42c5fed14a',
                '6b86b273ff34fce19d6b804eff5a3f5747ada4eaa22f1d49c01e52ddb7875b4b',
                '7ed00270e394c3e190d18a977f5d0e1ed889bdc03a637e8fe35f00946841b0bf',
                'e7f6c011776e8db7cd330b54174fd76f7d0216b612387a5ffcfb81e6f0919683',
                'ef2d127de37b942baad06145e54b0c619a1f22327b2ebbcfbec78f5564afe39d',
              ],
              ch02: [
                '4b227777d4dd1fc61c6f884f48641d02b4d121d3fd328cb08b5531fcacdabf8a',
                '5feceb66ffc86f38d952786c6d696c79c2dbc239dd4e91b46729d73a27fb57e9',
                '4b227777d4dd1fc61c6f884f48641d02b4d121d3fd328cb08b5531fcacdabf8a',
                'ef2d127de37b942baad06145e54b0c619a1f22327b2ebbcfbec78f5564afe39d',
                'e7f6c011776e8db7cd330b54174fd76f7d0216b612387a5ffcfb81e6f0919683',
              ],
              ch03: [
                'd4735e3a265e16eee03f59718b9b5d03019c07d8b6c51f90da3a666eec13ab35',
                'a770d3270c9dcdedf12ed9fd70444f7c8a95c26cae3cae9bd867499090a2f14b',
                '4e07408562bedb8b60ce05c1decfe3ad16b72230967de01f640b7e4729b49fce',
                '7902699be42c8a8e46fbbb4501726517e86b22c56a189f7625a6da49081b2451',
                'ef2d127de37b942baad06145e54b0c619a1f22327b2ebbcfbec78f5564afe39d',
              ],
              ch04: [
                '19581e27de7ced00ff1ce50b2047e7a567c76b1cbaebabe5ef03f7c3017bb5b7',
                '4e07408562bedb8b60ce05c1decfe3ad16b72230967de01f640b7e4729b49fce',
                'ef2d127de37b942baad06145e54b0c619a1f22327b2ebbcfbec78f5564afe39d',
                '4a44dc15364204a80fe80e9039455cc1608281820fe2b24f1e5233ade6af1dd5',
                '4b227777d4dd1fc61c6f884f48641d02b4d121d3fd328cb08b5531fcacdabf8a',
              ],
              ch05: [
                '6b86b273ff34fce19d6b804eff5a3f5747ada4eaa22f1d49c01e52ddb7875b4b',
                '4e07408562bedb8b60ce05c1decfe3ad16b72230967de01f640b7e4729b49fce',
                'd4735e3a265e16eee03f59718b9b5d03019c07d8b6c51f90da3a666eec13ab35',
                'd4735e3a265e16eee03f59718b9b5d03019c07d8b6c51f90da3a666eec13ab35',
                '6b86b273ff34fce19d6b804eff5a3f5747ada4eaa22f1d49c01e52ddb7875b4b',
              ],
              ch06: [
                'ef2d127de37b942baad06145e54b0c619a1f22327b2ebbcfbec78f5564afe39d',
                'd4735e3a265e16eee03f59718b9b5d03019c07d8b6c51f90da3a666eec13ab35',
                'd4735e3a265e16eee03f59718b9b5d03019c07d8b6c51f90da3a666eec13ab35',
                'ef2d127de37b942baad06145e54b0c619a1f22327b2ebbcfbec78f5564afe39d',
                'e7f6c011776e8db7cd330b54174fd76f7d0216b612387a5ffcfb81e6f0919683',
              ],
              ch07: [
                '6b51d431df5d7f141cbececcf79edf3dd861c3b4069f0b11661a3eefacbba918',
                '2abaca4911e68fa9bfbf3482ee797fd5b9045b841fdff7253557c5fe15de6477',
                '624b60c58c9d8bfb6ff1886c2fd605d2adeb6ea4da576068201b6c6958ce93f4',
                '59e19706d51d39f66711c2653cd7eb1291c94d9b55eb14bda74ce4dc636d015a',
                'a68b412c4282555f15546cf6e1fc42893b7e07f271557ceb021821098dd66c1b',
              ],
              ch08: [
                '6f4b6612125fb3a0daecd2799dfd6c9c299424fd920f9b308110a2c1fbd8f443',
                '02d20bbd7e394ad5999a4cebabac9619732c343a4cac99470c03e23ba2bdc2bc',
                '79d6eaa2676189eb927f2e16a70091474078e2117c3fc607d35cdc6b591ef355',
                '02d20bbd7e394ad5999a4cebabac9619732c343a4cac99470c03e23ba2bdc2bc',
                'b17ef6d19c7a5b1ee83b907c595526dcb1eb06db8227d650d5dda0a9f4ce8cd9',
              ],
            };

            function normalize(value) {
              return String(value)
                .replace(/[！-～]/g, (character) =>
                  String.fromCharCode(character.charCodeAt(0) - 0xfee0)
                )
                .replace(/[−–—]/g, '-')
                .replace(/[\s　]/g, '');
            }

            function sha256(value) {
              return crypto.createHash('sha256')
                .update(normalize(value), 'utf8')
                .digest('hex');
            }

            const issueLabels = context.payload.issue.labels.map(({ name }) => name);
            const chapterFromLabel = Object.keys(answerHashes)
              .find((chapterLabel) => issueLabels.includes(chapterLabel));
            const titleMatch = context.payload.issue.title.match(/^\[課題(0[1-8])\]/);
            const chapter = chapterFromLabel || (titleMatch && `ch${titleMatch[1]}`);

            if (!chapter) {
              core.setFailed('課題の章ラベル（ch01〜ch08）が見つかりません。');
              return;
            }

            const body = context.payload.issue.body || '';
            function extract(label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const pattern = new RegExp(
                '###[ \\t]*' + escaped + '[ \\t]*\\r?\\n([\\s\\S]*?)(?=\\r?\\n###[ \\t]|\\s*$)'
              );
              const match = body.match(pattern);
              return match ? match[1].trim() : '';
            }

            const hashes = answerHashes[chapter];
            let correctCount = 0;
            const rows = hashes.map((expectedHash, index) => {
              const label = `問${index + 1}`;
              const answer = extract(label);
              const correct = answer.length > 0 && sha256(answer) === expectedHash;
              if (correct) correctCount++;
              return `- ${label}: ${correct ? '正解' : '不正解'}`;
            });

            const score = correctCount * 4;
            const perfect = correctCount === hashes.length;
            const comment = [
              '## 採点結果',
              '',
              ...rows,
              '',
              `**得点: ${score}/20**`,
              '',
              perfect
                ? '満点です。'
                : '新しい課題 Issue を作成すると再挑戦できます。',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: comment,
            });

            const scoreLabel = `assignment-score-${score}`;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: scoreLabel });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: scoreLabel,
                color: score === 20 ? '2da44e' : 'd4a72c',
                description: `課題の得点: ${score}/20`,
              });
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [scoreLabel],
            });

            await github.rest.issues.update({
              owner,
              repo,
              issue_number,
              state: 'closed',
            });
