name: 課題07 場合の数 の提出
description: 第7章 場合の数 の課題07を提出します（GitHub Actionsで自動採点します）
title: "[課題07] 場合の数"
labels: ["assignment", "ch07"]
body:
  - type: markdown
    attributes:
      value: |
        **提出前の確認**

        各問の答えは、単位や式を付けず、半角数字だけで整数を1つ入力してください。計算過程は書かないでください。
        GitHub Actions が自動採点します。不正解の場合は、答えを見直して再提出できます。
        回答は公開されるため、個人情報を書かないでください。模範解答や解説は公開しません。
  - type: input
    id: q1
    attributes:
      label: 問1
      description: 4種類のシャツから1枚、3種類のズボンから1本を選ぶ組合せは何通りありますか。
    validations:
      required: true
  - type: input
    id: q2
    attributes:
      label: 問2
      description: 異なる5冊の本を一列に並べる方法は何通りありますか。
    validations:
      required: true
  - type: input
    id: q3
    attributes:
      label: 問3
      description: 異なる6人から会長と副会長を1人ずつ選ぶ方法は何通りありますか。
    validations:
      required: true
  - type: input
    id: q4
    attributes:
      label: 問4
      description: 異なる8人から委員を2人選ぶ方法は何通りありますか。
    validations:
      required: true
  - type: input
    id: q5
    attributes:
      label: 問5
      description: 0と1を重複を許して並べて作る長さ6の文字列は何通りありますか。
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開回答への同意
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true
