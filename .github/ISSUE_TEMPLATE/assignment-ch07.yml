name: 課題07 場合の数 の提出
description: 第7章 場合の数 の課題07を提出します（採点は手動で行います）
title: "[課題07] 場合の数"
labels: ["assignment", "ch07"]
body:
  - type: markdown
    attributes:
      value: |
        **注意**

        採点は手動で行います。回答は公開されるため、個人情報は書かないでください。

        各問、答えだけでなく **数え方と計算過程** も書いてください。
  - type: textarea
    id: q1
    attributes:
      label: 問1 和・積の法則と余事象
      description: 英字だけまたは数字だけのコードと、両方を少なくとも1文字含むコードを、計算過程とともに求めてください。
    validations:
      required: true
  - type: textarea
    id: q2
    attributes:
      label: 問2 順列
      description: 7冊のうち指定した2冊が隣り合う場合と隣り合わない場合を、数え方とともに求めてください。
    validations:
      required: true
  - type: textarea
    id: q3
    attributes:
      label: 問3 発展的な順列
      description: 同じものを含む順列と7人の円順列を、それぞれ計算過程とともに求めてください。
    validations:
      required: true
  - type: textarea
    id: q4
    attributes:
      label: 問4 組合せ
      description: 女子がちょうど2人の場合と少なくとも1人の場合を、数え方とともに求めてください。
    validations:
      required: true
  - type: textarea
    id: q5
    attributes:
      label: 問5 順列と組合せの使い分け
      description: 委員と役職者の各場合について方法・理由・場合の数を書き、別の数え方でも一致を示してください。
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開に関する確認
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true
