name: 課題01 数と式の提出
description: 第1章「数と式」の数値解答をGitHub Actionsで自動採点します
title: "[課題01] 数と式"
labels: ["assignment", "ch01"]
body:
  - type: markdown
    attributes:
      value: |
        各問の解答は、単位・式・途中式を含めず、半角の整数1つだけを入力してください。
  - type: input
    id: q1
    attributes:
      label: 問1
      description: "$|-18|$ を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q2
    attributes:
      label: 問2
      description: "$x^3-2x+5$ を $x+2$ で割ったときの余りを求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q3
    attributes:
      label: 問3
      description: "$(2x-3)^2$ における $x$ の係数を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q4
    attributes:
      label: 問4
      description: "$\\dfrac{\\sqrt{72}}{\\sqrt{2}}$ を計算せよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q5
    attributes:
      label: 問5
      description: "複素数 $3+4i$ の絶対値 $|3+4i|$ を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開回答への同意
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true
