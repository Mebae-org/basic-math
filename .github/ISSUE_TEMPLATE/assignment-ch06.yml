name: 課題06 図形と方程式 の提出
description: 第6章 図形と方程式 の課題06を提出します（GitHub Actionsで自動採点します）
title: "[課題06] 図形と方程式"
labels: ["assignment", "ch06"]
body:
  - type: markdown
    attributes:
      value: |
        **回答方法**

        全5問、各問4点です。
        各問には半角数字で整数を1つだけ入力してください。単位、式、途中式は書かないでください。
        提出後、GitHub Actionsが自動採点します。再挑戦する場合は、新しいIssueを作成してください。
        回答は公開されます。個人情報は書かないでください。
  - type: input
    id: q1
    attributes:
      label: 問1
      description: 点(0,0)と点(3,4)の距離を求めよ。
    validations:
      required: true
  - type: input
    id: q2
    attributes:
      label: 問2
      description: 点(-2,3)と点(6,7)の中点のx座標を求めよ。
    validations:
      required: true
  - type: input
    id: q3
    attributes:
      label: 問3
      description: 点(1,2)と点(4,8)を通る直線の傾きを求めよ。
    validations:
      required: true
  - type: input
    id: q4
    attributes:
      label: 問4
      description: 円 x^2+y^2−6x+4y−12=0 の半径を求めよ。
    validations:
      required: true
  - type: input
    id: q5
    attributes:
      label: 問5
      description: 楕円 x^2/9+y^2/4=1 の長軸の長さを求めよ。
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開回答への同意
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true
