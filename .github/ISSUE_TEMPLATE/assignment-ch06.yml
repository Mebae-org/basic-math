name: 課題06 図形と方程式 の提出
description: 第6章 図形と方程式 の課題06を提出します（採点は手動で行います）
title: "[課題06] 図形と方程式"
labels: ["assignment", "ch06"]
body:
  - type: markdown
    attributes:
      value: |
        **注意**

        採点は手動で行います。回答は公開されるため、個人情報は書かないでください。

        各問、答えだけでなく **途中式または判断理由** も書いてください。
  - type: textarea
    id: q1
    attributes:
      label: 問1 距離と内分点
      description: A(-4,2), B(6,7) の距離と、AP:PB=3:2 の内分点を、途中式とともに求めてください。
    validations:
      required: true
  - type: textarea
    id: q2
    attributes:
      label: 問2 直線の方程式
      description: 2点を通る直線と、指定点を通りそれに垂直な直線を、途中式とともに求めてください。
    validations:
      required: true
  - type: textarea
    id: q3
    attributes:
      label: 問3 円の方程式と位置関係
      description: 円の中心・半径を求め、直線との位置関係を中心からの距離で判定してください。
    validations:
      required: true
  - type: textarea
    id: q4
    attributes:
      label: 問4 円錐曲線
      description: 標準形への変形過程と、種類・中心・開く向き・漸近線を書いてください。
    validations:
      required: true
  - type: textarea
    id: q5
    attributes:
      label: 問5 不等式の領域
      description: 領域と境界の扱いを説明し、2点を代入して判定してください。
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開に関する確認
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true
