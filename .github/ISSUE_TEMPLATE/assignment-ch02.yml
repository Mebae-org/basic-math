name: 課題02 方程式と不等式の提出
description: 第2章「方程式と不等式」の数値解答をGitHub Actionsで自動採点します
title: "[課題02] 方程式と不等式"
labels: ["assignment", "ch02"]
body:
  - type: markdown
    attributes:
      value: |
        各問の解答は、単位・式・途中式を含めず、半角の整数1つだけを入力してください。
  - type: input
    id: q1
    attributes:
      label: 問1
      description: "方程式 $x^2-7x+12=0$ の大きい方の解を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q2
    attributes:
      label: 問2
      description: "方程式 $x^2+2x+5=0$ の実数解の個数を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q3
    attributes:
      label: 問3
      description: "連立方程式 $x+y=7$, $x-y=1$ を満たす $x$ を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q4
    attributes:
      label: 問4
      description: "不等式 $2x-5<6$ を満たす最大の整数 $x$ を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: input
    id: q5
    attributes:
      label: 問5
      description: "方程式 $x^3-6x^2+11x-6=0$ のすべての解の和を求めよ。"
      placeholder: 半角の整数1つだけを入力
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開回答への同意
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true
