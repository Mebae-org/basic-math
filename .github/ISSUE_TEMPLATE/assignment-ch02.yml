name: 課題02 方程式と不等式 の提出
description: 第2章 方程式と不等式 の課題02を提出します（教員が手動で採点します）
title: "[課題02] 方程式と不等式"
labels: ["assignment", "ch02"]
body:
  - type: markdown
    attributes:
      value: |
        **注意**

        回答は公開されます。個人情報は書かないでください。

        すべての問で、答えだけでなく **途中式・条件確認・根拠** も書いてください。採点は教員が手動で行います。
  - type: textarea
    id: q1
    attributes:
      label: 問1 二次方程式（3x²-4x-2=0）
      description: 解の公式による途中式と、判別式による実数解の個数を書いてください。
    validations:
      required: true
  - type: textarea
    id: q2
    attributes:
      label: 問2 高次方程式と因数定理（x³+x²-10x+8=0）
      description: 調べた値、因数定理、因数分解の過程を書いてください。
    validations:
      required: true
  - type: textarea
    id: q3
    attributes:
      label: 問3 連立方程式（y=2x-1, x²+y²=5）
      description: 代入後の計算と、解の順序対を書いてください。
    validations:
      required: true
  - type: textarea
    id: q4
    attributes:
      label: 問4 無理方程式（√(x+4)=x-2）
      description: 2乗前の条件、途中式、候補の検算を書いてください。
    validations:
      required: true
  - type: textarea
    id: q5
    attributes:
      label: 問5 分数方程式（2/(x-1)+1/(x+2)=1）
      description: 定義域の除外値と、分母を払った後の途中式を書いてください。
    validations:
      required: true
  - type: textarea
    id: q6
    attributes:
      label: 問6 一次不等式（-2<3-5x≤13）
      description: 不等号の逆転を明示し、区間表示まで書いてください。
    validations:
      required: true
  - type: textarea
    id: q7
    attributes:
      label: 問7 二次不等式（-2x²+5x+3<0）
      description: 零点、放物線の向き、符号判断を書いてください。
    validations:
      required: true
  - type: textarea
    id: q8
    attributes:
      label: 問8 恒等式と係数比較（2x²+7x-4≡A(x+1)²+B(x+1)+C）
      description: 展開と係数比較の式を書いてください。
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開回答への同意
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true
