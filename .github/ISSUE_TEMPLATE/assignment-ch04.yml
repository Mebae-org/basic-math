name: 課題04 指数関数と対数関数 の提出
description: 第4章の課題04を提出します（教員が手動で採点します）
title: "[課題04] 指数関数と対数関数"
labels: ["assignment", "ch04"]
body:
  - type: markdown
    attributes:
      value: |
        **提出前の確認**

        この課題は教員が手動で採点します。各問で答えだけでなく途中式または判断の根拠を書いてください。
        回答は公開されます。個人情報は書かないでください。
  - type: textarea
    id: q1
    attributes:
      label: 問1 n乗根と指数法則（4点）
      description: √[4]{(-3)^4}、-125の実数の3乗根、32^(2/5)、a^(7/3)a^(-1/2)÷a^(5/6)を、途中式とともに答えてください。
    validations:
      required: true
  - type: textarea
    id: q2
    attributes:
      label: 問2 指数関数のグラフ（4点）
      description: y=(1/2)^(x-1)-2 の移動、定義域、値域、増減、水平漸近線、概形を説明してください。
    validations:
      required: true
  - type: textarea
    id: q3
    attributes:
      label: 問3 指数方程式と指数不等式（4点）
      description: 4^x-5・2^x+4=0 と (1/3)^(2x+1)>(1/3)^(x-2) を、途中式とともに解いてください。
    validations:
      required: true
  - type: textarea
    id: q4
    attributes:
      label: 問4 対数の定義・法則とグラフ（4点）
      description: log_2(1/8)、log_3(18)-log_3(2)を計算し、y=log_(1/2)(x+1)+2 の定義域、値域、増減、垂直漸近線を答えてください。
    validations:
      required: true
  - type: textarea
    id: q5
    attributes:
      label: 問5 対数方程式と対数不等式（4点）
      description: log_2(x-1)+log_2(x-3)=3 と log_(1/2)(x-1)≧log_(1/2)(5-x) を、真数条件と途中式を明記して解いてください。
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開への同意
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true
