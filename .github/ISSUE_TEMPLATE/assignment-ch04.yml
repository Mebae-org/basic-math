name: 課題04 指数関数と対数関数 の提出
description: 第4章の課題04を提出します（GitHub Actionsで自動採点します）
title: "[課題04] 指数関数と対数関数"
labels: ["assignment", "ch04"]
body:
  - type: markdown
    attributes:
      value: |
        **回答方法**

        回答は公開されます。個人情報は書かないでください。

        各問には半角整数を1つだけ入力してください。単位・式・途中計算は書かないでください。
        GitHub Actions が自動採点します。不正解の場合は、新しい Issue を作成して再挑戦できます。正解や解答例は公開しません。
  - type: input
    id: q1
    attributes:
      label: 問1
      description: '$27^{2/3}$ を計算してください。'
    validations:
      required: true
  - type: input
    id: q2
    attributes:
      label: 問2
      description: '方程式 $2^{x+1}=16$ を満たす $x$ を求めてください。'
    validations:
      required: true
  - type: input
    id: q3
    attributes:
      label: 問3
      description: '$\log_2 32$ を計算してください。'
    validations:
      required: true
  - type: input
    id: q4
    attributes:
      label: 問4
      description: '方程式 $\log_3(x-1)=2$ を満たす $x$ を求めてください。'
    validations:
      required: true
  - type: input
    id: q5
    attributes:
      label: 問5
      description: '不等式 $\left(\dfrac12\right)^x<\dfrac18$ を満たす最小の整数 $x$ を求めてください。'
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開回答への同意
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true
