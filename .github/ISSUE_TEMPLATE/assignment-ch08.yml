name: 課題08 数列 の提出
description: 第8章 数列 の課題08を提出します（GitHub Actionsで自動採点します）
title: "[課題08] 数列"
labels: ["assignment", "ch08"]
body:
  - type: markdown
    attributes:
      value: |
        **提出前の確認**

        各問の答えは、単位や式を付けず、半角数字だけで整数を1つ入力してください。計算過程は書かないでください。
        GitHub Actions が自動採点します。不正解の場合は、答えを見直して再提出できます。
        回答は公開されるため、個人情報を書かないでください。模範解答や解説は公開しません。
  - type: input
    id: q1
    attributes:
      label: 問1
      description: 初項3、公差2の等差数列の第10項を求めてください。
    validations:
      required: true
  - type: input
    id: q2
    attributes:
      label: 問2
      description: 1から10までの整数の和を求めてください。
    validations:
      required: true
  - type: input
    id: q3
    attributes:
      label: 問3
      description: 初項2、公比3の等比数列の第5項を求めてください。
    validations:
      required: true
  - type: input
    id: q4
    attributes:
      label: 問4
      description: \(\displaystyle \sum_{k=1}^{5} k^2\) の値を求めてください。
    validations:
      required: true
  - type: input
    id: q5
    attributes:
      label: 問5
      description: 無限等比級数 \(8+4+2+\cdots\) の和を求めてください。
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開回答への同意
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true
