name: 課題08 数列 の提出
description: 第8章 数列 の課題08を提出します（採点は手動で行います）
title: "[課題08] 数列"
labels: ["assignment", "ch08"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **注意**

        回答は公開されます。個人情報は書かないでください。

        各問、答えだけでなく **途中式または判定理由** も書いてください。教員が手動で採点します。
  - type: textarea
    id: q1
    attributes:
      label: 問1 数列と一般項（S_n=n^2+4n）
      description: 一般項を求め、a_1も確認してください。（3点）
    validations:
      required: true
  - type: textarea
    id: q2
    attributes:
      label: 問2 等差数列（初項12、公差-2）
      description: 第18項と初項から第18項までの和を、途中式とともに書いてください。（4点）
    validations:
      required: true
  - type: textarea
    id: q3
    attributes:
      label: 問3 等比数列（初項2、公比3）
      description: 第7項と初項から第7項までの和を、途中式とともに書いてください。（4点）
    validations:
      required: true
  - type: textarea
    id: q4
    attributes:
      label: 問4 シグマ記号と和（Σ[k=1..8](2k^2-k)）
      description: 基本公式を使った途中式と答えを書いてください。（3点）
    validations:
      required: true
  - type: textarea
    id: q5
    attributes:
      label: 問5 数列の極限（有理式、(-1)^n）
      description: 2つの数列の収束・発散、極限または発散理由を書いてください。（3点）
    validations:
      required: true
  - type: textarea
    id: q6
    attributes:
      label: 問6 無限等比級数（5-5/2+5/4-5/8+...）
      description: 公比と収束条件を示して判定し、収束する場合は和を求めてください。（3点）
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開に関する確認
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true
