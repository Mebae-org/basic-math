name: 課題05 三角関数 の提出
description: 第5章の課題05を提出します（GitHub Actionsで自動採点します）
title: "[課題05] 三角関数"
labels: ["assignment", "ch05"]
body:
  - type: markdown
    attributes:
      value: |
        **回答方法**

        全5問、各問4点です。
        各問には半角数字で整数を1つだけ入力してください。単位、式、途中式は書かないでください。
        提出後、GitHub Actionsが自動採点します。再挑戦する場合は、新しいIssueを作成してください。
        回答は公開されます。個人情報は書かないでください。
  - type: input
    id: q1
    attributes:
      label: 問1
      description: 180度=nπラジアンのとき、nを求めよ。
    validations:
      required: true
  - type: input
    id: q2
    attributes:
      label: 問2
      description: 6 sin(π/6)を計算せよ。
    validations:
      required: true
  - type: input
    id: q3
    attributes:
      label: 問3
      description: y=sin(2x)について、2πを基本周期で割った値を求めよ。
    validations:
      required: true
  - type: input
    id: q4
    attributes:
      label: 問4
      description: 0≤x<2πにおける方程式 sin x=1/2 の解の個数を求めよ。
    validations:
      required: true
  - type: input
    id: q5
    attributes:
      label: 問5
      description: 4 sin(π/12)cos(π/12)を計算せよ。
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開回答への同意
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true
