name: 課題03 関数 の提出
description: 第3章 関数 の課題03を提出します（教員が手動で採点します）
title: "[課題03] 関数"
labels: ["assignment", "ch03"]
body:
  - type: markdown
    attributes:
      value: |
        **注意**

        回答は公開されます。個人情報は書かないでください。

        すべての問で、答えだけでなく **途中式・条件確認・根拠** も書いてください。採点は教員が手動で行います。
  - type: textarea
    id: q1
    attributes:
      label: 問1 関数・定義域・値域（f(x)=√(4-x²)）
      description: 根号内の条件を示し、定義域と値域を書いてください。
    validations:
      required: true
  - type: textarea
    id: q2
    attributes:
      label: 問2 二次関数のグラフ（y=-x²+6x-5）
      description: 平方完成、頂点、軸、向き、両切片とグラフを示してください。
    validations:
      required: true
  - type: textarea
    id: q3
    attributes:
      label: 問3 二次関数の最大・最小（y=2x²-8x+3, -1≤x≤4）
      description: 頂点と両端の値を比較し、最大・最小とそのときのxを書いてください。
    validations:
      required: true
  - type: textarea
    id: q4
    attributes:
      label: 問4 分数関数（y=(2x-1)/(x+1)）
      description: 式変形、定義域、値域、漸近線とグラフの概形を示してください。
    validations:
      required: true
  - type: textarea
    id: q5
    attributes:
      label: 問5 分数関数を含む不等式（(x-2)/(x+3)≥0）
      description: 分子・分母の零点と符号表を示してください。
    validations:
      required: true
  - type: textarea
    id: q6
    attributes:
      label: 問6 無理関数（y=-2√(3-x)+4）
      description: 定義域、値域、端点とグラフの概形を示してください。
    validations:
      required: true
  - type: textarea
    id: q7
    attributes:
      label: 問7 無理不等式（√(x+1)≤x-1）
      description: 定義域、符号条件、2乗後の不等式を示してください。
    validations:
      required: true
  - type: textarea
    id: q8
    attributes:
      label: 問8 逆関数（f(x)=(x+2)²-1, x≥-2）
      description: 逆関数、定義域、もとの値域と合成による確認を書いてください。
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開回答への同意
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true
