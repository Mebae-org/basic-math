name: 課題03 関数 の提出
description: 第3章 関数 の課題03を提出します（GitHub Actionsで自動採点します）
title: "[課題03] 関数"
labels: ["assignment", "ch03"]
body:
  - type: markdown
    attributes:
      value: |
        **回答方法**

        回答は公開されます。個人情報は書かないでください。

        各問には半角整数を1つだけ入力してください。単位・式・途中計算は書かないでください。
        GitHub Actions が自動採点します。不正解の場合は、新しい Issue を作成して再挑戦できます。正解や解答例は公開しません。
  - type: input
    id: q1
    attributes:
      label: 問1
      description: '関数 $y=2x^2-8x+1$ の頂点の $x$ 座標を求めてください。'
    validations:
      required: true
  - type: input
    id: q2
    attributes:
      label: 問2
      description: '関数 $y=2x^2-8x+1$ の最小値を求めてください。'
    validations:
      required: true
  - type: input
    id: q3
    attributes:
      label: 問3
      description: '関数 $y=\dfrac{3x+1}{x-2}$ の水平漸近線の $y$ 座標を求めてください。'
    validations:
      required: true
  - type: input
    id: q4
    attributes:
      label: 問4
      description: '$f(x)=2x-5$ のとき、$f^{-1}(9)$ を求めてください。'
    validations:
      required: true
  - type: input
    id: q5
    attributes:
      label: 問5
      description: '$\sqrt{x+1}\leq2$ を満たす整数 $x$ の個数を求めてください。'
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開回答への同意
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true
